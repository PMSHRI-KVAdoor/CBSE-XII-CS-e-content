<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Python ↔ MySQL — Interactive Course</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0C1116;
  --panel:#141B23;
  --panel2:#1B2530;
  --text:#E7EDF3;
  --muted:#8CA0B3;
  --py:#4B9FE1;
  --my:#F2A33E;
  --ok:#6FD98F;
  --err:#E86B6B;
  --rule:#26323E;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
::selection{background:var(--py);color:#04121c;}

/* header */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:18px 28px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:rgba(12,17,22,0.92);backdrop-filter:blur(6px);
  z-index:20;flex-wrap:wrap;
}
.topbar .brand{
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;
  display:flex;align-items:center;gap:10px;white-space:nowrap;
}
.brand .dot1{color:var(--py);}
.brand .dot2{color:var(--my);}
.brand-mark{
  width:26px;height:26px;border-radius:6px;
  background:linear-gradient(135deg,var(--py),var(--my));
  display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#0C1116;
}
.progress-wrap{flex:1;min-width:160px;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--py),var(--my));transition:width .4s ease;}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);white-space:nowrap;}
.playbtn{
  border:1px solid var(--rule);background:var(--panel2);color:var(--text);
  border-radius:99px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:12px;
  cursor:pointer;display:flex;align-items:center;gap:6px;transition:.15s;
}
.playbtn:hover{border-color:var(--py);color:var(--py);}
.playbtn:focus-visible{outline:2px solid var(--py);outline-offset:2px;}

/* layout */
.layout{display:flex;max-width:1280px;margin:0 auto;}
.sidebar{
  width:260px;flex-shrink:0;padding:24px 12px;border-right:1px solid var(--rule);
  position:sticky;top:73px;height:calc(100vh - 73px);overflow-y:auto;
}
.chapter-item{
  display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;
  cursor:pointer;margin-bottom:2px;transition:.15s;
}
.chapter-item:hover{background:var(--panel2);}
.chapter-item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--py);}
.chapter-num{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);
  width:22px;height:22px;border-radius:6px;border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
}
.chapter-item.active .chapter-num{border-color:var(--py);color:var(--py);}
.chapter-item.done .chapter-num{background:var(--ok);border-color:var(--ok);color:#04150a;}
.chapter-title{font-size:13px;line-height:1.4;color:var(--text);}
.chapter-item.active .chapter-title{color:var(--py);font-weight:600;}

.main{flex:1;min-width:0;padding:32px 40px 80px;}
@media (max-width:820px){
  .sidebar{display:none;}
  .main{padding:24px 18px 60px;}
}

.eyebrow{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--my);
  letter-spacing:.06em;margin-bottom:8px;
}
h1.chapter-h{
  font-family:'Space Grotesk',sans-serif;font-size:32px;margin:0 0 14px;line-height:1.2;
}
.lead{color:var(--muted);font-size:15px;line-height:1.7;max-width:70ch;margin-bottom:26px;}
.lead b{color:var(--text);}
.lead code, p code, li code{
  font-family:'JetBrains Mono',monospace;background:var(--panel2);
  padding:1px 6px;border-radius:5px;font-size:13px;color:var(--my);
}

/* terminal */
.stage{display:grid;grid-template-columns:1.1fr 0.9fr;gap:20px;align-items:start;}
@media (max-width:960px){.stage{grid-template-columns:1fr;}}

.terminal{
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;overflow:hidden;
}
.term-head{
  display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel2);
  border-bottom:1px solid var(--rule);
}
.term-dot{width:10px;height:10px;border-radius:50%;}
.term-head .fname{
  margin-left:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
}
.term-body{
  padding:18px 16px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.7;
  min-height:220px;white-space:pre-wrap;word-break:break-word;
}
.term-body .ln-code{color:#CDE3F5;}
.term-body .ln-out{color:var(--ok);}
.term-body .ln-out.err{color:var(--err);}
.term-body .ln-comment{color:var(--muted);}
.cursor-caret{display:inline-block;width:7px;height:14px;background:var(--py);vertical-align:middle;animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}

.controls-row{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule);background:var(--panel2);flex-wrap:wrap;}
.ctl-btn{
  border:1px solid var(--rule);background:var(--panel);color:var(--text);
  border-radius:8px;padding:7px 12px;font-family:'JetBrains Mono',monospace;font-size:12px;
  cursor:pointer;transition:.15s;
}
.ctl-btn:hover{border-color:var(--py);color:var(--py);}
.ctl-btn:focus-visible{outline:2px solid var(--py);outline-offset:2px;}
.ctl-btn.primary{background:var(--py);color:#04121c;border-color:var(--py);font-weight:600;}
.ctl-btn.primary:hover{opacity:.88;color:#04121c;}

.notes{
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;
}
.notes h3{font-family:'Space Grotesk',sans-serif;font-size:15px;margin:0 0 10px;color:var(--my);}
.notes ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.8;}
.notes li{margin-bottom:4px;}
.notes .rowcount-track{
  margin-top:14px;display:flex;flex-direction:column;gap:6px;
}
.rc-step{
  display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:6px 10px;border-radius:6px;background:var(--panel2);opacity:.35;transition:.2s;
}
.rc-step.active{opacity:1;box-shadow:inset 3px 0 0 var(--my);}
.rc-step .val{color:var(--ok);font-weight:600;}

/* subtabs for static / parameterized queries */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.subtab{
  border:1px solid var(--rule);background:var(--panel2);color:var(--muted);
  border-radius:99px;padding:6px 13px;font-family:'JetBrains Mono',monospace;font-size:11.5px;
  cursor:pointer;transition:.15s;
}
.subtab:hover{color:var(--text);}
.subtab.active{background:var(--my);color:#1a0e00;border-color:var(--my);font-weight:600;}

/* footer nav */
.foot-nav{display:flex;justify-content:space-between;margin-top:30px;gap:10px;}
.nav-btn{
  flex:1;max-width:48%;border:1px solid var(--rule);background:var(--panel);color:var(--text);
  border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;transition:.15s;
}
.nav-btn:hover{border-color:var(--py);}
.nav-btn .lbl{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.nav-btn .ttl{font-size:14px;margin-top:4px;color:var(--text);font-weight:600;}
.nav-btn.next{text-align:right;margin-left:auto;}
.nav-btn:disabled{opacity:.3;cursor:not-allowed;}

/* quiz */
.quiz-card{
  background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;margin-bottom:16px;
}
.quiz-q{font-size:14.5px;margin-bottom:12px;font-weight:600;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{
  border:1px solid var(--rule);background:var(--panel2);color:var(--text);
  border-radius:8px;padding:10px 14px;text-align:left;cursor:pointer;font-size:13.5px;transition:.15s;
}
.quiz-opt:hover{border-color:var(--py);}
.quiz-opt.correct{border-color:var(--ok);background:rgba(111,217,143,0.12);}
.quiz-opt.wrong{border-color:var(--err);background:rgba(232,107,107,0.12);}
.quiz-feedback{margin-top:10px;font-size:12.5px;color:var(--muted);min-height:18px;}
.score-banner{
  font-family:'Space Grotesk',sans-serif;font-size:20px;text-align:center;padding:26px;
  border:1px solid var(--rule);border-radius:12px;background:var(--panel);
}

.download-row{margin-top:34px;text-align:center;}
.download-row a{
  display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;
  font-family:'JetBrains Mono',monospace;text-decoration:none;border-bottom:1px dashed var(--rule);padding-bottom:2px;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="brand-mark">py</span>
    <span><span class="dot1">Python</span> ↔ <span class="dot2">MySQL</span></span>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="progress-label" id="progressLabel">Chapter 1 / 9</div>
  <button class="playbtn" id="playBtn" aria-pressed="false">▶ Autoplay</button>
</div>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="Chapters"></nav>
  <main class="main" id="main"></main>
</div>

<script>
/* ---------------------------------------------------------------
   CONTENT MODEL
   Each chapter: title, eyebrow, lead, and either a "terminal" demo
   (lines typed progressively with output revealed after) or a
   custom render function (rowcount stepper / subtabs / quiz).
--------------------------------------------------------------- */

const chapters = [
{
  id:'intro',
  eyebrow:'Chapter 01 — Foundations',
  title:'Connecting Python to MySQL',
  lead:'Before writing code, every database program follows the same seven-step shape. Watch the sequence once — the rest of the course is just filling in each step.',
  type:'steps',
  steps:[
    'Open the Python editor',
    'Import the package required — import mysql.connector',
    'Open a CONNECTION to the database',
    'Create a CURSOR instance',
    'Execute the QUERY via the CURSOR object',
    'Extract data from the CURSOR object',
    'Clean up the environment (close the connection)'
  ],
  notes:[
    'The <code>mysql.connector</code> module is installed with <code>pip install mysql_connector_python</code>.',
    'Every one of these seven steps reappears, in order, in every example in this course.'
  ]
},
{
  id:'connect',
  eyebrow:'Chapter 02 — Opening a connection',
  title:'import + connect()',
  lead:'The <code>connect()</code> function opens the link between Python and MySQL. It needs four pieces of information: where the server lives, who is connecting, the password, and which database to use.',
  type:'terminal',
  filename:'connect_demo.py',
  code:[
    {t:'code', text:"import mysql.connector as m"},
    {t:'code', text:"con = m.connect(host='localhost', user='root',"},
    {t:'code', text:"                passwd='1234', database='class')"},
    {t:'code', text:"print(con.is_connected())"}
  ],
  output:[
    {t:'out', text:'True'}
  ],
  notes:[
    '<b>host</b> — where MySQL is hosted, usually <code>"localhost"</code>.',
    '<b>user</b> — the MySQL account name, usually <code>"root"</code>.',
    '<b>passwd</b> — the password for that user.',
    '<b>database</b> — the schema whose tables you want to use.',
    '<code>is_connected()</code> returns <code>True</code> once the link is live.'
  ]
},
{
  id:'cursor',
  eyebrow:'Chapter 03 — Cursor & execute()',
  title:'The cursor object',
  lead:'A <b>cursor</b> is the middleman between your Python code and MySQL — it sends SQL to the server and holds whatever comes back. <code>execute()</code> takes the SQL as a plain string.',
  type:'terminal',
  filename:'cursor_demo.py',
  code:[
    {t:'code', text:"con = m.connect(host='localhost', user='root',"},
    {t:'code', text:"                passwd='1234', database='class')"},
    {t:'code', text:"cur = con.cursor()"},
    {t:'code', text:"query = \"SELECT * FROM users\""},
    {t:'code', text:"cur.execute(query)"}
  ],
  output:[
    {t:'comment', text:'# result set now sits inside the cursor object "cur"'}
  ],
  notes:[
    'The cursor is created from the connection: <code>con.cursor()</code>.',
    'It can (a) execute SQL commands and (b) fetch results.',
    'Nothing is printed yet — <code>execute()</code> only loads the result into the cursor.'
  ]
},
{
  id:'fetch',
  eyebrow:'Chapter 04 — Reading results',
  title:'fetchall / fetchone / fetchmany',
  lead:'Three functions pull rows out of the cursor. Each row arrives as a tuple, so a normal <code>for</code> loop displays the table.',
  type:'terminal',
  filename:'fetch_demo.py',
  code:[
    {t:'code', text:"cur.execute(\"SELECT * FROM users\")"},
    {t:'code', text:"data = cur.fetchall()"},
    {t:'code', text:"for row in data:"},
    {t:'code', text:"    print(row)"}
  ],
  output:[
    {t:'out', text:"(1, 'Asha', 'Class12')"},
    {t:'out', text:"(2, 'Rohan', 'Class11')"},
    {t:'out', text:"(3, 'Meera', 'Class12')"}
  ],
  notes:[
    '<code>fetchall()</code> — every remaining row, as a list of tuples.',
    '<code>fetchone()</code> — the single next row.',
    '<code>fetchmany(n)</code> — the next <code>n</code> rows (default 1).',
    'Rows are tuples — iterate to print each one on its own line.'
  ]
},
{
  id:'rowcount',
  eyebrow:'Chapter 05 — A property, not a preview',
  title:'cursor.rowcount',
  lead:'<code>rowcount</code> does not tell you how many rows the query <i>will</i> return — it tells you how many rows have been <b>fetched so far</b>. Step through a 10-row table to see it grow.',
  type:'rowcount',
  table_size:10,
  seq:[
    {action:'cur.execute("select * from student")', desc:'All 10 rows loaded into the cursor. Nothing fetched yet.', count:0},
    {action:'data = cur.fetchone()', desc:'1 row fetched.', count:1},
    {action:'data = cur.fetchmany(4)', desc:'4 more rows fetched → 5 total.', count:5},
    {action:'data = cur.fetchone()', desc:'1 more row fetched → 6 total.', count:6},
    {action:'data = cur.fetchall()', desc:'Remaining 4 rows fetched → 10 total.', count:10}
  ],
  notes:[
    '<code>rowcount</code> is a running tally of rows pulled out, updated after every fetch call.',
    'This is the single most common trap in exam questions on this topic.'
  ]
},
{
  id:'commit',
  eyebrow:'Chapter 06 — Finishing up',
  title:'commit() and close()',
  lead:'Any query that changes data — INSERT, UPDATE, DELETE — is not saved until you call <code>commit()</code>. Always release the connection with <code>close()</code> when you\'re done, since MySQL only allows a limited number of open connections.',
  type:'terminal',
  filename:'commit_close_demo.py',
  code:[
    {t:'code', text:"cur.execute(\"UPDATE STUDENT SET MARKS=100 WHERE MARKS=40\")"},
    {t:'code', text:"con.commit()"},
    {t:'code', text:"print(cur.rowcount, \"RECORD UPDATED\")"},
    {t:'code', text:"con.close()"}
  ],
  output:[
    {t:'out', text:'2 RECORD UPDATED'}
  ],
  notes:[
    'Forgetting <code>commit()</code> is the classic bug: the change works in your session but never reaches the table.',
    '<code>con.close()</code> frees the connection slot on the server.'
  ]
},
{
  id:'static',
  eyebrow:'Chapter 07 — Static queries',
  title:'DDL & DML from Python',
  lead:'A <b>static query</b> is built with no Python variables mixed in — the SQL string is fixed. Flip through the common table operations below.',
  type:'subtabs',
  tabs:[
    {label:'CREATE TABLE', code:[
      {t:'code',text:"cur.execute(\"CREATE TABLE FEES (ROLLNO INT, NAME VARCHAR(20), AMOUNT INT);\")"}
    ], output:[{t:'comment',text:'# table FEES created'}]},
    {label:'SHOW TABLES', code:[
      {t:'code',text:"cur.execute(\"SHOW TABLES\")"},
      {t:'code',text:"for data in cur:"},
      {t:'code',text:"    print(data)"}
    ], output:[
      {t:'out',text:"('fees',)"},{t:'out',text:"('student',)"}
    ]},
    {label:'DESC TABLE', code:[
      {t:'code',text:"cur.execute(\"DESC STUDENT\")"},
      {t:'code',text:"for data in cur:"},
      {t:'code',text:"    print(data)"}
    ], output:[
      {t:'out',text:"('ROLLNO', 'int', 'YES', '', None, '')"},
      {t:'out',text:"('MARKS', 'int', 'YES', '', None, '')"}
    ]},
    {label:'SELECT', code:[
      {t:'code',text:"cur.execute(\"select * from student\")"},
      {t:'code',text:"r = cur.fetchone()"},
      {t:'code',text:"while r is not None:"},
      {t:'code',text:"    print(r)"},
      {t:'code',text:"    r = cur.fetchone()"}
    ], output:[
      {t:'out',text:"(1, 'Asha', 92)"},{t:'out',text:"(2, 'Rohan', 40)"}
    ]},
    {label:'SELECT + WHERE', code:[
      {t:'code',text:"cur.execute(\"select * from student where marks>90\")"},
      {t:'code',text:"r = cur.fetchall()"},
      {t:'code',text:"print(\"total no of rows:\", cur.rowcount)"},
      {t:'code',text:"for row in r:"},
      {t:'code',text:"    print(row)"}
    ], output:[
      {t:'out',text:'total no of rows: 1'},
      {t:'out',text:"(1, 'Asha', 92)"}
    ]},
    {label:'UPDATE', code:[
      {t:'code',text:"cur.execute(\"UPDATE STUDENT SET MARKS=100 WHERE MARKS=40\")"},
      {t:'code',text:"con.commit()"},
      {t:'code',text:"print(cur.rowcount, \"RECORD UPDATED\")"}
    ], output:[{t:'out',text:'1 RECORD UPDATED'}]},
    {label:'DELETE', code:[
      {t:'code',text:"cur.execute(\"DELETE FROM STUDENT WHERE MARKS<50\")"},
      {t:'code',text:"con.commit()"},
      {t:'code',text:"print(cur.rowcount, \"RECORD DELETED\")"}
    ], output:[{t:'out',text:'0 RECORD DELETED'}]},
    {label:'DROP TABLE', code:[
      {t:'code',text:"cur.execute(\"DROP TABLE STUDENT\")"}
    ], output:[{t:'comment',text:'# table STUDENT removed'}]},
    {label:'ADD COLUMN', code:[
      {t:'code',text:"cur.execute(\"ALTER TABLE STUDENT ADD AGE INT\")"},
      {t:'code',text:"con.commit()"}
    ], output:[{t:'comment',text:'# column AGE added'}]},
    {label:'DROP COLUMN', code:[
      {t:'code',text:"cur.execute(\"ALTER TABLE STUDENT DROP AGE\")"},
      {t:'code',text:"con.commit()"}
    ], output:[{t:'comment',text:'# column AGE removed'}]},
    {label:'MODIFY DATATYPE', code:[
      {t:'code',text:"cur.execute(\"ALTER TABLE STUDENT MODIFY GRADE CHAR(3)\")"}
    ], output:[{t:'comment',text:'# GRADE column retyped to CHAR(3)'}]}
  ],
  notes:[
    'Every DDL/DML change (UPDATE, DELETE, ALTER, INSERT) still needs <code>con.commit()</code> to be saved permanently.',
    '<code>cur.rowcount</code> after UPDATE/DELETE tells you how many rows were affected.'
  ]
},
{
  id:'param',
  eyebrow:'Chapter 08 — Building queries dynamically',
  title:'Parameterized queries',
  lead:'A parameterized query drops a Python variable into the SQL string so the query reacts to user input. There are two equivalent styles — compare them.',
  type:'subtabs',
  tabs:[
    {label:'.format() — roll no', code:[
      {t:'code',text:"rn = int(input('Enter Roll no. '))     # user enters 10"},
      {t:'code',text:"query = \"select * from student where rollno = {}\".format(rn)"},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:'# query becomes: select * from student where rollno = 10'}]},
    {label:'.format() — column & value', code:[
      {t:'code',text:"col_name = eval(input('Enter Column Name '))   # Rollno"},
      {t:'code',text:"col_value = eval(input('Enter Column Value '))  # 12"},
      {t:'code',text:"query = \"select * from student where {} = {}\".format(col_name, col_value)"},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:'# query becomes: select * from student where Rollno = 12'}]},
    {label:'.format() — class & section', code:[
      {t:'code',text:"cls = eval(input('Enter Class '))     # 12"},
      {t:'code',text:"sec = eval(input('Enter Section '))   # A"},
      {t:'code',text:"query = \"select * from student where class = {} and section = '{}'\".format(cls, sec)"},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:"# query becomes: ...where class = 12 and section = 'A'"}]},
    {label:'f-string — roll no', code:[
      {t:'code',text:"rn = int(input('Enter Roll no. '))   # user enters 10"},
      {t:'code',text:"query = f\"select * from student where rollno = {rn}\""},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:'# query becomes: select * from student where rollno = 10'}]},
    {label:'f-string — column & value', code:[
      {t:'code',text:"col_name = eval(input('Enter Column Name '))   # Rollno"},
      {t:'code',text:"col_value = eval(input('Enter Column Value '))  # 12"},
      {t:'code',text:"query = f\"select * from student where {col_name} = {col_value}\""},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:'# query becomes: select * from student where Rollno = 12'}]},
    {label:'f-string — class & section', code:[
      {t:'code',text:"cls = eval(input('Enter Class '))     # 12"},
      {t:'code',text:"sec = eval(input('Enter Section '))   # A"},
      {t:'code',text:"query = f\"select * from student where class = {cls} and section = '{sec}'\""},
      {t:'code',text:"cur.execute(query)"}
    ], output:[{t:'comment',text:"# query becomes: ...where class = 12 and section = 'A'"}]}
  ],
  notes:[
    '<code>.format()</code> fills <code>{}</code> placeholders in the order given.',
    'An f-string reads the variable name directly inside <code>{ }</code> — same result, different syntax.',
    'A text column\'s value needs quotes inside the SQL, e.g. <code>section = \'A\'</code>.'
  ]
},
{
  id:'quiz',
  eyebrow:'Chapter 09 — Check yourself',
  title:'Quick quiz',
  lead:'Five questions covering the whole course. Pick an answer to see if you\'re right.',
  type:'quiz',
  questions:[
    {
      q:'Which function creates the object used to run SQL commands from Python?',
      options:['con.connect()','con.cursor()','con.execute()','con.commit()'],
      answer:1,
      why:'The cursor is created from the connection object using con.cursor().'
    },
    {
      q:'A table has 10 rows. After cur.fetchone() then cur.fetchmany(4), what does cur.rowcount show?',
      options:['1','4','5','10'],
      answer:2,
      why:'1 row + 4 rows fetched so far = rowcount of 5, not the total rows in the table.'
    },
    {
      q:'Which call is required to permanently save an UPDATE or DELETE?',
      options:['con.close()','cur.execute()','con.commit()','cur.fetchall()'],
      answer:2,
      why:'Without con.commit(), the change is never written to the actual table.'
    },
    {
      q:'query = f"select * from student where rollno = {rn}" is an example of:',
      options:['A static query','A parameterized query','A DDL command','A cursor property'],
      answer:1,
      why:'It inserts a Python variable into the SQL string, so it reacts to whatever rn holds.'
    },
    {
      q:'Which fetch function returns exactly one row from the cursor?',
      options:['fetchall()','fetchmany()','fetchone()','rowcount()'],
      answer:2,
      why:'fetchone() returns a single row; fetchall() returns everything remaining.'
    }
  ]
}
];

/* ---------------------------------------------------------------
   STATE
--------------------------------------------------------------- */
let currentChapter = 0;
let visited = new Set();
let autoplay = false;
let autoplayTimer = null;
let typingBusy = false;

const sidebarEl = document.getElementById('sidebar');
const mainEl = document.getElementById('main');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const playBtn = document.getElementById('playBtn');

function buildSidebar(){
  sidebarEl.innerHTML = '';
  chapters.forEach((ch,i)=>{
    const item = document.createElement('div');
    item.className = 'chapter-item' + (i===currentChapter?' active':'') + (visited.has(i)?' done':'');
    item.tabIndex = 0;
    item.setAttribute('role','button');
    item.innerHTML = `<div class="chapter-num">${visited.has(i) && i!==currentChapter ? '✓' : i+1}</div><div class="chapter-title">${ch.title}</div>`;
    item.addEventListener('click', ()=>goTo(i));
    item.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' ') goTo(i); });
    sidebarEl.appendChild(item);
  });
}

function updateProgress(){
  const pct = ((currentChapter)/(chapters.length-1))*100;
  progressBar.style.width = pct + '%';
  progressLabel.textContent = `Chapter ${currentChapter+1} / ${chapters.length}`;
}

function goTo(i){
  if(i<0||i>=chapters.length) return;
  currentChapter = i;
  visited.add(i);
  stopAutoplay();
  buildSidebar();
  updateProgress();
  renderChapter(chapters[i]);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------------------------------------------------------------
   RENDERERS
--------------------------------------------------------------- */
function chapterHeader(ch){
  return `<div class="eyebrow">${ch.eyebrow}</div><h1 class="chapter-h">${ch.title}</h1><p class="lead">${ch.lead}</p>`;
}

function footerNav(ch){
  const idx = chapters.indexOf(ch);
  const prev = chapters[idx-1];
  const next = chapters[idx+1];
  return `<div class="foot-nav">
    <button class="nav-btn prev" ${!prev?'disabled':''} id="prevBtn"><div class="lbl">← Previous</div><div class="ttl">${prev?prev.title:'—'}</div></button>
    <button class="nav-btn next" ${!next?'disabled':''} id="nextBtn"><div class="lbl">Next →</div><div class="ttl">${next?next.title:'Finish'}</div></button>
  </div>`;
}

function attachFooterNav(){
  const p = document.getElementById('prevBtn');
  const n = document.getElementById('nextBtn');
  if(p) p.addEventListener('click', ()=>goTo(currentChapter-1));
  if(n) n.addEventListener('click', ()=>goTo(currentChapter+1));
}

function renderChapter(ch){
  if(ch.type==='steps') return renderSteps(ch);
  if(ch.type==='terminal') return renderTerminal(ch);
  if(ch.type==='rowcount') return renderRowcount(ch);
  if(ch.type==='subtabs') return renderSubtabs(ch);
  if(ch.type==='quiz') return renderQuiz(ch);
}

/* --- steps chapter (chapter 1) --- */
function renderSteps(ch){
  mainEl.innerHTML = `
    ${chapterHeader(ch)}
    <div class="terminal" style="max-width:640px">
      <div class="term-head"><div class="term-dot" style="background:#F2504A"></div><div class="term-dot" style="background:#F2A33E"></div><div class="term-dot" style="background:#6FD98F"></div><div class="fname">connectivity_flow.py</div></div>
      <div class="term-body" id="stepsBody"></div>
      <div class="controls-row">
        <button class="ctl-btn primary" id="runSteps">▶ Play sequence</button>
        <button class="ctl-btn" id="resetSteps">↺ Reset</button>
      </div>
    </div>
    ${footerNav(ch)}
  `;
  attachFooterNav();
  const body = document.getElementById('stepsBody');
  function reset(){ body.innerHTML=''; }
  function play(){
    reset();
    ch.steps.forEach((s,i)=>{
      setTimeout(()=>{
        const line = document.createElement('div');
        line.className='ln-code';
        line.innerHTML = `<span style="color:var(--my)">${i+1}.</span> ${s}`;
        body.appendChild(line);
      }, i*550);
    });
  }
  document.getElementById('runSteps').addEventListener('click', play);
  document.getElementById('resetSteps').addEventListener('click', reset);
  play();
  markTypingDone(ch.steps.length*550 + 300);
}

/* --- terminal (typed code + revealed output) chapter --- */
function renderTerminal(ch){
  mainEl.innerHTML = `
    ${chapterHeader(ch)}
    <div class="stage">
      <div class="terminal">
        <div class="term-head"><div class="term-dot" style="background:#F2504A"></div><div class="term-dot" style="background:#F2A33E"></div><div class="term-dot" style="background:#6FD98F"></div><div class="fname">${ch.filename}</div></div>
        <div class="term-body" id="termBody"></div>
        <div class="controls-row">
          <button class="ctl-btn primary" id="runCode">▶ Run</button>
          <button class="ctl-btn" id="resetCode">↺ Reset</button>
        </div>
      </div>
      <div class="notes">
        <h3>What's happening</h3>
        <ul>${ch.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
      </div>
    </div>
    ${footerNav(ch)}
  `;
  attachFooterNav();
  const body = document.getElementById('termBody');
  function reset(){ body.innerHTML=''; }
  function play(){
    reset();
    typeSequence(body, ch.code, ch.output, ()=>{});
  }
  document.getElementById('runCode').addEventListener('click', play);
  document.getElementById('resetCode').addEventListener('click', reset);
  play();
}

function typeSequence(container, codeLines, outputLines, onDone){
  let delay = 0;
  codeLines.forEach((line,i)=>{
    setTimeout(()=>typeLine(container, line, i===codeLines.length-1 && outputLines.length===0), delay);
    delay += 45*line.text.length + 260;
  });
  outputLines.forEach((line,i)=>{
    setTimeout(()=>{
      const div = document.createElement('div');
      div.className = line.t==='err' ? 'ln-out err' : (line.t==='comment' ? 'ln-comment' : 'ln-out');
      div.textContent = (line.t==='out' ? '>>> ' : '') + line.text;
      container.appendChild(div);
    }, delay + i*280 + 200);
  });
  const total = delay + outputLines.length*280 + 400;
  markTypingDone(total);
  if(onDone) setTimeout(onDone, total);
}

function typeLine(container, line, isLast){
  const div = document.createElement('div');
  div.className = line.t==='comment' ? 'ln-comment' : 'ln-code';
  container.appendChild(div);
  const caret = document.createElement('span');
  caret.className='cursor-caret';
  let i=0;
  const text = line.text;
  const iv = setInterval(()=>{
    div.textContent = text.slice(0,i);
    if(i<text.length){ div.appendChild(caret); }
    i++;
    if(i>text.length){ clearInterval(iv); if(caret.parentNode) caret.remove(); }
  }, 18);
}

/* --- rowcount stepper chapter --- */
function renderRowcount(ch){
  mainEl.innerHTML = `
    ${chapterHeader(ch)}
    <div class="stage">
      <div class="terminal">
        <div class="term-head"><div class="term-dot" style="background:#F2504A"></div><div class="term-dot" style="background:#F2A33E"></div><div class="term-dot" style="background:#6FD98F"></div><div class="fname">rowcount_demo.py</div></div>
        <div class="term-body" id="rcBody" style="min-height:160px"></div>
        <div class="controls-row">
          <button class="ctl-btn primary" id="rcNext">▶ Next fetch call</button>
          <button class="ctl-btn" id="rcReset">↺ Reset</button>
        </div>
      </div>
      <div class="notes">
        <h3>Table: STUDENT (${ch.table_size} rows)</h3>
        <div class="rowcount-track" id="rcTrack">
          ${ch.seq.map((s,i)=>`<div class="rc-step" id="rcstep-${i}"><span>${s.action}</span><span class="val">rowcount = ${s.count}</span></div>`).join('')}
        </div>
        <ul style="margin-top:14px">${ch.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
      </div>
    </div>
    ${footerNav(ch)}
  `;
  attachFooterNav();
  const body = document.getElementById('rcBody');
  let step = -1;
  function reset(){
    step = -1;
    body.innerHTML = '';
    ch.seq.forEach((_,i)=>document.getElementById(`rcstep-${i}`).classList.remove('active'));
  }
  function next(){
    if(step >= ch.seq.length-1){ reset(); return; }
    step++;
    const s = ch.seq[step];
    const line = document.createElement('div');
    line.className='ln-code';
    line.textContent = s.action;
    body.appendChild(line);
    const desc = document.createElement('div');
    desc.className='ln-comment';
    desc.textContent = '# ' + s.desc;
    body.appendChild(desc);
    document.querySelectorAll('.rc-step').forEach(el=>el.classList.remove('active'));
    document.getElementById(`rcstep-${step}`).classList.add('active');
  }
  document.getElementById('rcNext').addEventListener('click', next);
  document.getElementById('rcReset').addEventListener('click', reset);
  next();
  markTypingDone(1200);
}

/* --- subtabs chapter (static queries / parameterized queries) --- */
function renderSubtabs(ch){
  mainEl.innerHTML = `
    ${chapterHeader(ch)}
    <div class="subtabs" id="subtabRow">
      ${ch.tabs.map((t,i)=>`<button class="subtab${i===0?' active':''}" data-i="${i}">${t.label}</button>`).join('')}
    </div>
    <div class="stage">
      <div class="terminal">
        <div class="term-head"><div class="term-dot" style="background:#F2504A"></div><div class="term-dot" style="background:#F2A33E"></div><div class="term-dot" style="background:#6FD98F"></div><div class="fname" id="subFname">${ch.tabs[0].label.toLowerCase().replace(/[^a-z]+/g,'_')}.py</div></div>
        <div class="term-body" id="subBody"></div>
        <div class="controls-row">
          <button class="ctl-btn primary" id="subRun">▶ Run</button>
        </div>
      </div>
      <div class="notes">
        <h3>Key points</h3>
        <ul>${ch.notes.map(n=>`<li>${n}</li>`).join('')}</ul>
      </div>
    </div>
    ${footerNav(ch)}
  `;
  attachFooterNav();
  let activeTab = 0;
  const body = document.getElementById('subBody');
  function play(){
    body.innerHTML='';
    const tab = ch.tabs[activeTab];
    typeSequence(body, tab.code, tab.output, ()=>{});
    document.getElementById('subFname').textContent = tab.label.toLowerCase().replace(/[^a-z]+/g,'_') + '.py';
  }
  document.querySelectorAll('#subtabRow .subtab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#subtabRow .subtab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = parseInt(btn.dataset.i,10);
      play();
    });
  });
  document.getElementById('subRun').addEventListener('click', play);
  play();
}

/* --- quiz chapter --- */
function renderQuiz(ch){
  mainEl.innerHTML = `
    ${chapterHeader(ch)}
    <div id="quizArea"></div>
    <div id="scoreArea"></div>
    ${footerNav(ch)}
  `;
  attachFooterNav();
  const quizArea = document.getElementById('quizArea');
  const scoreArea = document.getElementById('scoreArea');
  let score = 0;
  let answered = 0;

  ch.questions.forEach((q,qi)=>{
    const card = document.createElement('div');
    card.className='quiz-card';
    card.innerHTML = `<div class="quiz-q">${qi+1}. ${q.q}</div><div class="quiz-opts"></div><div class="quiz-feedback"></div>`;
    const optsWrap = card.querySelector('.quiz-opts');
    const feedback = card.querySelector('.quiz-feedback');
    q.options.forEach((opt,oi)=>{
      const b = document.createElement('button');
      b.className='quiz-opt';
      b.textContent = opt;
      b.addEventListener('click', ()=>{
        if(b.disabled) return;
        [...optsWrap.children].forEach(c=>c.disabled=true);
        if(oi===q.answer){
          b.classList.add('correct');
          feedback.textContent = '✓ Correct — ' + q.why;
          score++;
        } else {
          b.classList.add('wrong');
          optsWrap.children[q.answer].classList.add('correct');
          feedback.textContent = '✗ Not quite — ' + q.why;
        }
        answered++;
        if(answered===ch.questions.length){
          scoreArea.innerHTML = `<div class="score-banner">You scored ${score} / ${ch.questions.length} 🎓</div>`;
        }
      });
      optsWrap.appendChild(b);
    });
    quizArea.appendChild(card);
  });
}

/* ---------------------------------------------------------------
   AUTOPLAY (moves between chapters like video "play")
--------------------------------------------------------------- */
function markTypingDone(ms){
  typingBusy = true;
  clearTimeout(window.__typingDoneTimer);
  window.__typingDoneTimer = setTimeout(()=>{ typingBusy=false; }, ms);
}

function startAutoplay(){
  autoplay = true;
  playBtn.textContent = '⏸ Pause';
  playBtn.setAttribute('aria-pressed','true');
  scheduleNextAuto();
}
function stopAutoplay(){
  autoplay = false;
  playBtn.textContent = '▶ Autoplay';
  playBtn.setAttribute('aria-pressed','false');
  clearTimeout(autoplayTimer);
}
function scheduleNextAuto(){
  clearTimeout(autoplayTimer);
  autoplayTimer = setTimeout(()=>{
    if(!autoplay) return;
    if(currentChapter < chapters.length-1){
      currentChapter++;
      visited.add(currentChapter);
      buildSidebar();
      updateProgress();
      renderChapter(chapters[currentChapter]);
      window.scrollTo({top:0,behavior:'smooth'});
      scheduleNextAuto();
    } else {
      stopAutoplay();
    }
  }, 6500);
}
playBtn.addEventListener('click', ()=>{
  if(autoplay) stopAutoplay(); else startAutoplay();
});

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
visited.add(0);
buildSidebar();
updateProgress();
renderChapter(chapters[0]);
</script>
